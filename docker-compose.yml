#version: '3.9'

services:

  app:
    build: .
    container_name: rpg_app
    depends_on:
      - postgres
      - mongo
    volumes:
      - .:/app
      - ~/.local:/root/.local   # persistência do kernel instalado
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=rpgdados
      - POSTGRES_USER=rpg_user
      - POSTGRES_PASSWORD=strongpassword
      - MONGO_HOST=mongo
      - MONGO_PORT=27017

  postgres: # banco de dados relacional
    image: postgres:15
    container_name: rpg_postgres
    restart: always
    environment:
      - POSTGRES_DB=rpgdados
      - POSTGRES_USER=rpg_user
      - POSTGRES_PASSWORD=strongpassword
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  mongo: # banco de dados NoSQL
    image: mongo:6
    container_name: rpg_mongo
    restart: always
    volumes:
      - mongodata:/data/db
    ports:
      - "27017:27017"

  metabase: # DataViz para substituir PowerBI
    image: metabase/metabase:latest
    container_name: rpg_metabase
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    environment:
      - MB_DB_TYPE=postgres
      - MB_DB_DBNAME=metabase
      - MB_DB_PORT=5432
      - MB_DB_USER=rpg_user
      - MB_DB_PASS=strongpassword
      - MB_DB_HOST=postgres
    volumes:
      - metabase_data:/metabase-data   

volumes:
  pgdata:
  mongodata:
  metabase_data:
