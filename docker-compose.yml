#version: '3.9'

services:

  app:
    build: .
    container_name: rpg_app
    depends_on:
      - postgres
      - mongo
    volumes:
      - .:/app
      - ~/.local:/root/.local   # persistência do kernel instalado
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=rpgdados
      - POSTGRES_USER=rpg_user
      - POSTGRES_PASSWORD=strongpassword
      - MONGO_HOST=mongo
      - MONGO_PORT=27017

  postgres:
    image: postgres:15
    container_name: rpg_postgres
    restart: always
    environment:
      - POSTGRES_DB=rpgdados
      - POSTGRES_USER=rpg_user
      - POSTGRES_PASSWORD=strongpassword
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  mongo:
    image: mongo:6
    container_name: rpg_mongo
    restart: always
    volumes:
      - mongodata:/data/db
    ports:
      - "27017:27017"

volumes:
  pgdata:
  mongodata:
